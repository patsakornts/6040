<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ไทย 60/40</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a; --surface: #151515;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0f0f0; --muted: #555; --muted2: #888;
    --gov: #4ade80; --self: #60a5fa;
    --gov-bg: rgba(74,222,128,0.07); --self-bg: rgba(96,165,250,0.07);
    --gov-bd: rgba(74,222,128,0.18); --self-bd: rgba(96,165,250,0.18);
  }
  html, body { height: 100%; font-family: "Sarabun", sans-serif; background: var(--bg); color: var(--text); }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100svh; padding: 0 20px; gap: 0;
  }
  .tag { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 36px; text-align: center; }
  .input-group { width: 100%; max-width: 360px; margin-bottom: 28px; }
  .input-label { font-size: 12px; color: var(--muted2); margin-bottom: 10px; display: block; }
  .input-box {
    display: flex; align-items: center; border: 1px solid var(--border2); border-radius: 16px;
    background: var(--surface); overflow: hidden; transition: border-color .2s; height: 64px;
  }
  .input-box:focus-within { border-color: rgba(255,255,255,0.28); }
  .baht-sym { font-size: 20px; font-weight: 300; color: var(--muted2); padding: 0 18px 0 20px; flex-shrink: 0; user-select: none; }
  input[type="number"] {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    font-family: "Sarabun", sans-serif; font-size: 26px; font-weight: 300; letter-spacing: -0.5px;
    padding: 0; height: 100%; -moz-appearance: textfield; min-width: 0;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input::placeholder { color: var(--muted); }
  .clear-btn {
    background: transparent; border: none; border-left: 1px solid var(--border);
    color: var(--muted); font-family: "Sarabun", sans-serif; font-size: 12px;
    cursor: pointer; padding: 0 18px; height: 100%; flex-shrink: 0;
    transition: color .15s; -webkit-tap-highlight-color: transparent;
  }
  .clear-btn:active { color: var(--text); }
  .cards { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    border-radius: 20px; padding: 26px 24px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .card.gov  { background: var(--gov-bg);  border-color: var(--gov-bd); }
  .card.self { background: var(--self-bg); border-color: var(--self-bd); }
  .card-pct { font-size: 10px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 6px; }
  .gov  .card-pct { color: var(--gov); }
  .self .card-pct { color: var(--self); }
  .card-name { font-size: 14px; color: var(--muted2); }
  .card-right { text-align: right; flex-shrink: 0; }
  .card-amount { font-size: 28px; font-weight: 300; letter-spacing: -1px; line-height: 1; }
  .gov  .card-amount { color: var(--gov); }
  .self .card-amount { color: var(--self); }
  .card-unit { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .dash { color: rgba(255,255,255,0.1); font-size: 24px; font-weight: 300; }
</style>
</head>
<body>
<p class="tag">ไทย 60 / 40</p>
<div class="input-group">
  <label class="input-label" for="price">ราคาสินค้าที่ต้องจ่าย</label>
  <div class="input-box">
    <span class="baht-sym">฿</span>
    <input type="number" id="price" inputmode="decimal" placeholder="0.00" min="0" step="any" oninput="calc()" autocomplete="off">
    <button class="clear-btn" onclick="clearAll()">ล้าง</button>
  </div>
</div>
<div class="cards">
  <div class="card gov">
    <div class="card-left">
      <div class="card-pct">60%</div>
      <div class="card-name">รัฐออกให้</div>
    </div>
    <div class="card-right">
      <div class="card-amount" id="gov-amt"><span class="dash">&#8212;</span></div>
      <div class="card-unit" id="gov-unit"></div>
    </div>
  </div>
  <div class="card self">
    <div class="card-left">
      <div class="card-pct">40%</div>
      <div class="card-name">จำนวนเงินที่ต้องจ่ายเอง</div>
    </div>
    <div class="card-right">
      <div class="card-amount" id="self-amt"><span class="dash">&#8212;</span></div>
      <div class="card-unit" id="self-unit"></div>
    </div>
  </div>
</div>
<script>
  function fmt(n){return n.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function calc(){
    var v=parseFloat(document.getElementById("price").value);
    var gA=document.getElementById("gov-amt"),sA=document.getElementById("self-amt");
    var gU=document.getElementById("gov-unit"),sU=document.getElementById("self-unit");
    if(isNaN(v)||v<=0){
      gA.innerHTML=sA.innerHTML="<span class='dash'>&#8212;</span>";
      gU.textContent=sU.textContent="";return;
    }
    gA.textContent=fmt(v*0.6);sA.textContent=fmt(v*0.4);
    gU.textContent=sU.textContent="บาท";
  }
  function clearAll(){document.getElementById("price").value="";calc();}
</script>
</body>
</html>
