<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ไทย 60/40</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a; --surface: #151515;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0f0f0; --muted: #555; --muted2: #888;
    --total: #e2e2e2;
    --gov: #4ade80; --self: #60a5fa;
    --total-bg: rgba(255,255,255,0.04); --total-bd: rgba(255,255,255,0.12);
    --gov-bg: rgba(74,222,128,0.07); --self-bg: rgba(96,165,250,0.07);
    --gov-bd: rgba(74,222,128,0.18); --self-bd: rgba(96,165,250,0.18);
    --focus-total: rgba(255,255,255,0.3);
    --focus-gov: rgba(74,222,128,0.5);
    --focus-self: rgba(96,165,250,0.5);
  }
  html, body { height: 100%; font-family: "Sarabun", sans-serif; background: var(--bg); color: var(--text); }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100svh; padding: 40px 20px; gap: 0;
  }
  .tag { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 40px; text-align: center; }

  .fields { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }

  .field { width: 100%; }
  .field-label {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  .field-label .pct {
    font-size: 10px; padding: 1px 7px; border-radius: 20px; font-weight: 500;
  }

  .field.total .field-label { color: var(--muted2); }
  .field.gov   .field-label { color: var(--gov); }
  .field.self  .field-label { color: var(--self); }
  .field.gov  .pct { background: rgba(74,222,128,0.12); color: var(--gov); }
  .field.self .pct { background: rgba(96,165,250,0.12); color: var(--self); }

  .input-box {
    display: flex; align-items: center; border: 1px solid; border-radius: 16px;
    overflow: hidden; transition: border-color .2s, background .2s; height: 62px;
  }
  .field.total .input-box { background: var(--total-bg); border-color: var(--total-bd); }
  .field.gov   .input-box { background: var(--gov-bg);   border-color: var(--gov-bd); }
  .field.self  .input-box { background: var(--self-bg);  border-color: var(--self-bd); }

  .field.total .input-box:focus-within { border-color: var(--focus-total); }
  .field.gov   .input-box:focus-within { border-color: var(--focus-gov); }
  .field.self  .input-box:focus-within { border-color: var(--focus-self); }

  .baht-sym { font-size: 18px; font-weight: 300; color: var(--muted2); padding: 0 16px 0 18px; flex-shrink: 0; user-select: none; }
  .field.gov  .baht-sym { color: rgba(74,222,128,0.5); }
  .field.self .baht-sym { color: rgba(96,165,250,0.5); }

  input[type="number"] {
    flex: 1; background: transparent; border: none; outline: none;
    font-family: "Sarabun", sans-serif; font-size: 24px; font-weight: 300;
    letter-spacing: -0.5px; padding: 0; height: 100%;
    -moz-appearance: textfield; min-width: 0;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input::placeholder { color: var(--muted); }
  .field.total input { color: var(--total); }
  .field.gov   input { color: var(--gov); }
  .field.self  input { color: var(--self); }

  .clear-btn {
    background: transparent; border: none; border-left: 1px solid var(--border);
    color: var(--muted); font-family: "Sarabun", sans-serif; font-size: 12px;
    cursor: pointer; padding: 0 16px; height: 100%; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; transition: color .15s;
  }
  .clear-btn:active { color: var(--text); }

  .divider {
    width: 100%; max-width: 360px; display: flex; align-items: center; gap: 12px;
    margin: 4px 0;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-icon { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<p class="tag">ไทย 60 / 40</p>

<div class="fields">

  <div class="field total">
    <div class="field-label">ราคาสินค้าที่ต้องจ่าย</div>
    <div class="input-box">
      <span class="baht-sym">฿</span>
      <input type="number" id="f-total" inputmode="decimal" placeholder="0.00"
             min="0" step="any" oninput="calcFrom('total')" autocomplete="off">
      <button class="clear-btn" onclick="clearAll()">ล้าง</button>
    </div>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-icon">&#8597;</span>
    <div class="divider-line"></div>
  </div>

  <div class="field gov">
    <div class="field-label">รัฐออกให้ <span class="pct">60%</span></div>
    <div class="input-box">
      <span class="baht-sym">฿</span>
      <input type="number" id="f-gov" inputmode="decimal" placeholder="0.00"
             min="0" step="any" oninput="calcFrom('gov')" autocomplete="off">
    </div>
  </div>

  <div class="field self">
    <div class="field-label">จำนวนเงินที่ต้องจ่ายเอง <span class="pct">40%</span></div>
    <div class="input-box">
      <span class="baht-sym">฿</span>
      <input type="number" id="f-self" inputmode="decimal" placeholder="0.00"
             min="0" step="any" oninput="calcFrom('self')" autocomplete="off">
    </div>
  </div>

</div>

<script>
  var fTotal = document.getElementById("f-total");
  var fGov   = document.getElementById("f-gov");
  var fSelf  = document.getElementById("f-self");

  function fmt(n) {
    return n.toLocaleString("th-TH", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }
  function setVal(el, n) {
    el.value = (n > 0) ? parseFloat(n.toFixed(2)) : "";
  }

  function calcFrom(src) {
    var v = parseFloat(document.getElementById("f-" + src).value);
    if (isNaN(v) || v < 0) { return; }
    if (src === "total") {
      setVal(fGov,  v * 0.6);
      setVal(fSelf, v * 0.4);
    } else if (src === "gov") {
      setVal(fTotal, v / 0.6);
      setVal(fSelf,  (v / 0.6) * 0.4);
    } else {
      setVal(fTotal, v / 0.4);
      setVal(fGov,   (v / 0.4) * 0.6);
    }
  }

  function clearAll() {
    fTotal.value = fGov.value = fSelf.value = "";
  }
</script>
</body>
</html>
